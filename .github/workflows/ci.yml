name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loglens
          POSTGRES_PASSWORD: loglens
          POSTGRES_DB: loglens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loglens" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://loglens:loglens@localhost:5432/loglens_test
      TEST_DATABASE_URL: postgresql+psycopg://loglens:loglens@localhost:5432/loglens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests (PostgreSQL)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loglens
          POSTGRES_PASSWORD: loglens
          POSTGRES_DB: loglens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loglens" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://loglens:loglens@localhost:5432/loglens
      UPLOAD_RATE_LIMIT_PER_MINUTE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup npm run dev > /tmp/vite.log 2>&1 &
          npx --yes wait-on http://localhost:8000/health http://localhost:5173
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        run: cat /tmp/api.log /tmp/vite.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the Compose stack
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 3; done
          curl -fsS http://localhost:8080/api/v1/config
          curl -fsS -X POST http://localhost:8080/api/v1/datasets/samples/ssh-bruteforce
          test "$(curl -fsS http://localhost:8080/api/v1/alerts | python3 -c 'import sys,json;print(json.load(sys.stdin)["total"])')" = "2"
      - name: Read-only demo rejects writes
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build backend
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 3; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/v1/datasets/samples/ssh-normal)
          test "$code" = "403"
      - if: always()
        run: docker compose logs --no-color | tail -200
