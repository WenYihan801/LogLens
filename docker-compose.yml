# LogLens – full local stack (FR-34 local mode).
#   docker compose up --build        -> http://localhost:8080
#   docker compose down              (keeps the database volume)
#   docker compose down -v           (also deletes the database)
name: loglens

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loglens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loglens}
      POSTGRES_DB: ${POSTGRES_DB:-loglens}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    # Bound to localhost only, for local tools (psql, TablePlus, VS Code). Never public.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_READ_ONLY: ${DEMO_READ_ONLY:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-loglens}:${POSTGRES_PASSWORD:-loglens}@db:5432/${POSTGRES_DB:-loglens}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      MAX_LOG_LINES: ${MAX_LOG_LINES:-20000}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-10}
      SSH_LOG_YEAR: ${SSH_LOG_YEAR:-0}
      SSH_LOG_TIMEZONE: ${SSH_LOG_TIMEZONE:-UTC}
      SEED_SAMPLES: ${SEED_SAMPLES:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"   # Swagger UI at http://localhost:8000/docs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
