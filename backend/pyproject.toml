[project]
name = "loglens-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Newer Starlette suggests the httpx2 test client; httpx still works and is what we pin.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"alembic/versions/*" = ["E501"]
